<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder — open door casting light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#15110d"/>
      <stop offset="55%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#070605"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e0b4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f3e0b4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f3e0b4" stop-opacity="0.22"/>
